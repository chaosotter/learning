    // =========================================================================
    // 8. TAB 3: LIBRARY (PUBLIC GITHUB REPOSITORY LOADER & LOCAL FILE PICKER)
    // =========================================================================
    function parseGitHubRepoInput(rawOwnerRepo, rawPath, rawBranch) {
      let ownerRepo = String(rawOwnerRepo || '').trim();
      let path = String(rawPath || '').trim().replace(/^\/+|\/+$/g, '');
      let branch = String(rawBranch || '').trim() || 'main';

      // Support pasting full https://github.com/owner/repo/tree/branch/folder URLs
      const urlMatch = ownerRepo.match(/^https?:\/\/github\.com\/([^/]+\/[^/]+)(?:\/tree\/([^/]+)(?:\/(.*))?)?\/?$/i);
      if (urlMatch) {
        ownerRepo = urlMatch[1];
        if (urlMatch[2]) branch = urlMatch[2];
        if (urlMatch[3] && !path) path = urlMatch[3].replace(/^\/+|\/+$/g, '');
      }
      return { ownerRepo, path, branch };
    }

    function buildGitHubRawUrl(ownerRepo, branch, filePath) {
      const encodedFilePath = String(filePath || '')
        .split('/')
        .map(encodeURIComponent)
        .join('/');
      return `https://raw.githubusercontent.com/${ownerRepo}/${encodeURIComponent(branch)}/${encodedFilePath}`;
    }

    function formatByteSize(bytes) {
      const n = Number(bytes) || 0;
      if (n >= 1024 * 1024) return `${(n / (1024 * 1024)).toFixed(2)} MB`;
      if (n >= 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${n} B`;
    }

    function isZipBuffer(buf) {
      if (!buf || buf.byteLength < 4) return false;
      const u8 = new Uint8Array(buf, 0, 4);
      return u8[0] === 0x50 && u8[1] === 0x4b &&
        (u8[2] === 0x03 || u8[2] === 0x05) &&
        (u8[3] === 0x04 || u8[3] === 0x06);
    }

    function isSafeZipPath(name) {
      const s = String(name || '');
      if (!s || s.startsWith('/') || s.includes('\\')) return false;
      const parts = s.split('/');
      return parts.every(p => p !== '..' && p !== '.');
    }

    async function sha256HexBytes(u8) {
      if (!window.crypto || !window.crypto.subtle || typeof window.crypto.subtle.digest !== 'function') {
        return '';
      }
      const digest = await window.crypto.subtle.digest('SHA-256', u8.slice());
      return Array.from(new Uint8Array(digest))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    async function inflateRawBytes(compressedBytes) {
      if (typeof DecompressionStream !== 'function') {
        throw new Error('This browser does not support DecompressionStream required to open .kkpack archives.');
      }
      const ds = new DecompressionStream('deflate-raw');
      const writer = ds.writable.getWriter();
      const reader = ds.readable.getReader();
      const readAll = async () => {
        const chunks = [];
        let total = 0;
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) {
            total += value.byteLength;
            if (total > 32 * 1024 * 1024) {
              throw new Error('Archive entry exceeds maximum uncompressed size.');
            }
            chunks.push(value);
          }
        }
        const out = new Uint8Array(total);
        let offset = 0;
        for (const c of chunks) {
          out.set(c, offset);
          offset += c.byteLength;
        }
        return out;
      };
      const writeAll = async () => {
        await writer.write(compressedBytes.slice());
        await writer.close();
      };
      const [out] = await Promise.all([readAll(), writeAll()]);
      return out;
    }

    // Zero-dependency ZIP reader supporting Stored (0) and Deflate (8) entries
    // by walking the Central Directory (compatible with Go's streaming Data
    // Descriptors and optional ZIP64 headers).
    async function parseZipArchive(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      if (bytes.length < 22) {
        throw new Error('Archive is too small to be a valid ZIP/.kkpack file.');
      }

      const minPos = Math.max(0, bytes.length - 65557);
      let eocdPos = -1;
      for (let pos = bytes.length - 22; pos >= minPos; pos--) {
        if (dv.getUint32(pos, true) === 0x06054b50) {
          const commentLen = dv.getUint16(pos + 20, true);
          if (pos + 22 + commentLen === bytes.length) {
            eocdPos = pos;
            break;
          }
        }
      }
      if (eocdPos < 0) {
        throw new Error('ZIP End-of-Central-Directory record not found.');
      }

      let entryCount = dv.getUint16(eocdPos + 10, true);
      let cdOffset = dv.getUint32(eocdPos + 16, true);

      // Handle optional ZIP64 End of Central Directory Locator.
      if ((entryCount === 0xffff || cdOffset === 0xffffffff) && eocdPos >= 20 &&
          dv.getUint32(eocdPos - 20, true) === 0x07064b50 && typeof dv.getBigUint64 === 'function') {
        const z64Pos = Number(dv.getBigUint64(eocdPos - 12, true));
        if (z64Pos >= 0 && z64Pos + 56 <= bytes.length && dv.getUint32(z64Pos, true) === 0x06064b50) {
          entryCount = Number(dv.getBigUint64(z64Pos + 32, true));
          cdOffset = Number(dv.getBigUint64(z64Pos + 48, true));
        }
      }

      const decoder = new TextDecoder('utf-8');
      const entries = {};
      let cursor = cdOffset;
      for (let i = 0; i < entryCount; i++) {
        if (cursor + 46 > bytes.length || dv.getUint32(cursor, true) !== 0x02014b50) {
          throw new Error(`Invalid ZIP central directory entry at index ${i}.`);
        }
        const method = dv.getUint16(cursor + 10, true);
        const compressedSize = dv.getUint32(cursor + 20, true);
        const nameLen = dv.getUint16(cursor + 28, true);
        const extraLen = dv.getUint16(cursor + 30, true);
        const commentLen = dv.getUint16(cursor + 32, true);
        const localHeaderOffset = dv.getUint32(cursor + 42, true);
        const name = decoder.decode(bytes.subarray(cursor + 46, cursor + 46 + nameLen));
        cursor += 46 + nameLen + extraLen + commentLen;

        if (name.endsWith('/')) continue;
        if (!isSafeZipPath(name)) {
          throw new Error(`Unsafe archive entry path: "${name}".`);
        }
        if (localHeaderOffset + 30 > bytes.length || dv.getUint32(localHeaderOffset, true) !== 0x04034b50) {
          throw new Error(`Invalid ZIP local header for "${name}".`);
        }
        const localNameLen = dv.getUint16(localHeaderOffset + 26, true);
        const localExtraLen = dv.getUint16(localHeaderOffset + 28, true);
        const dataStart = localHeaderOffset + 30 + localNameLen + localExtraLen;
        const dataEnd = dataStart + compressedSize;
        if (dataEnd > bytes.length) {
          throw new Error(`Truncated ZIP entry data for "${name}".`);
        }

        const slice = bytes.subarray(dataStart, dataEnd);
        if (method === 0) {
          entries[name] = slice;
        } else if (method === 8) {
          entries[name] = await inflateRawBytes(slice);
        } else {
          throw new Error(`Unsupported ZIP compression method ${method} for "${name}".`);
        }
      }
      return entries;
    }

    async function unpackKkpackArrayBuffer(arrayBuffer, expectedArchiveSha256) {
      const archiveBytes = new Uint8Array(arrayBuffer);
      const archiveSha = await sha256HexBytes(archiveBytes);
      if (expectedArchiveSha256 && archiveSha && archiveSha.toLowerCase() !== String(expectedArchiveSha256).toLowerCase()) {
        throw new Error(`Archive SHA-256 mismatch (got ${archiveSha.slice(0, 12)}..., expected ${String(expectedArchiveSha256).slice(0, 12)}...).`);
      }

      const entries = await parseZipArchive(arrayBuffer);
      const manifestRaw = entries['manifest.json'];
      if (!manifestRaw) {
        throw new Error('Archive is missing manifest.json.');
      }
      const decoder = new TextDecoder('utf-8');
      const manifest = JSON.parse(decoder.decode(manifestRaw));
      if (!manifest || manifest.format_version !== 1 || !Array.isArray(manifest.modules) || manifest.modules.length === 0) {
        throw new Error('Unsupported or empty .kkpack manifest.json.');
      }

      const modules = [];
      for (const entry of manifest.modules) {
        const modBytes = entries[entry.path];
        if (!modBytes) {
          throw new Error(`Module "${entry.id}" missing at "${entry.path}".`);
        }
        if (entry.sha256) {
          const gotHash = await sha256HexBytes(modBytes);
          if (gotHash && gotHash.toLowerCase() !== String(entry.sha256).toLowerCase()) {
            throw new Error(`Checksum mismatch for "${entry.path}".`);
          }
        }
        const rawMod = JSON.parse(decoder.decode(modBytes));
        modules.push(validateAndNormalizeModule(rawMod));
      }
      return { manifest, modules, sha256: archiveSha };
    }

    function moduleIdFromFilename(name) {
      return String(name || '').replace(/\.json$/i, '').trim();
    }

    function isNonModuleJsonPath(path) {
      return /(^|\/)(catalog|manifest|package|package-lock|tsconfig)\.json$/i.test(String(path || ''));
    }

    function isPackFilename(name) {
      return /\.kkpack$/i.test(String(name || ''));
    }

    function parseRepoTreeFiles(treeItems, ownerRepo, branch, basePath) {
      const prefix = basePath ? `${basePath}/` : '';
      return treeItems
        .filter(item => {
          if (!item || item.type !== 'blob' || typeof item.path !== 'string') return false;
          const isPack = isPackFilename(item.path);
          const isJson = /\.json$/i.test(item.path) && !isNonModuleJsonPath(item.path);
          if (!isPack && !isJson) return false;
          if (prefix && !item.path.startsWith(prefix)) return false;
          return true;
        })
        .map(item => {
          const relPath = prefix ? item.path.slice(prefix.length) : item.path;
          const slashIdx = relPath.lastIndexOf('/');
          const folder = slashIdx >= 0 ? relPath.slice(0, slashIdx) : '';
          const name = slashIdx >= 0 ? relPath.slice(slashIdx + 1) : relPath;
          return {
            name,
            path: item.path,
            rel_path: relPath,
            folder,
            is_pack: isPackFilename(name),
            download_url: buildGitHubRawUrl(ownerRepo, branch, item.path),
            size: item.size || 0,
          };
        })
        .sort((a, b) => {
          const folderCmp = a.folder.localeCompare(b.folder);
          if (folderCmp !== 0) return folderCmp;
          return a.name.localeCompare(b.name);
        });
    }

    function groupRepoFilesByFolder(files) {
      const byFolder = new Map();
      (files || []).forEach(f => {
        const key = String(f.folder || '');
        if (!byFolder.has(key)) {
          byFolder.set(key, {
            folder: key,
            label: key ? key.split('/').join(' / ') : '(root)',
            files: [],
          });
        }
        byFolder.get(key).files.push(f);
      });
      return Array.from(byFolder.values()).sort((a, b) => a.folder.localeCompare(b.folder));
    }

    function toggleRepoFolderCollapse(folderKey) {
      if (state.collapsedRepoFolders.has(folderKey)) {
        state.collapsedRepoFolders.delete(folderKey);
      } else {
        state.collapsedRepoFolders.add(folderKey);
      }
      renderApp();
    }

    function expandAllRepoFolders() {
      state.collapsedRepoFolders.clear();
      renderApp();
    }

    function collapseAllRepoFolders() {
      const groups = groupRepoFilesByFolder(state.repoBrowser.files);
      state.collapsedRepoFolders = new Set(groups.map(g => g.folder));
      renderApp();
    }

    function catalogPackStatus(pack) {
      const modIDs = Array.isArray(pack.module_ids) ? pack.module_ids : [];
      const cachedCount = modIDs.filter(id => Boolean(state.modulesById[id])).length;
      const installed = state.installedPacks[pack.pack_key];
      const shaMatches = Boolean(installed && pack.sha256 && installed.sha256 === pack.sha256);
      const allModulesCached = modIDs.length > 0 && cachedCount === modIDs.length;
      if (allModulesCached && (shaMatches || !pack.sha256)) {
        return { state: 'up_to_date', cachedCount, totalCount: modIDs.length };
      }
      if (cachedCount > 0 || installed) {
        return { state: 'update', cachedCount, totalCount: modIDs.length };
      }
      return { state: 'missing', cachedCount, totalCount: modIDs.length };
    }

    async function browseGitHubRepo() {
      const ownerInput = document.getElementById('ghOwnerRepoInput');
      const pathInput = document.getElementById('ghPathInput');
      const branchInput = document.getElementById('ghBranchInput');

      const parsed = parseGitHubRepoInput(
        ownerInput ? ownerInput.value : state.repoConfig.ownerRepo,
        pathInput ? pathInput.value : state.repoConfig.path,
        branchInput ? branchInput.value : state.repoConfig.branch
      );

      if (!parsed.ownerRepo || !/^[^/\s]+\/[^/\s]+$/.test(parsed.ownerRepo)) {
        state.repoBrowser.error = 'Please enter a valid GitHub repository in "owner/repo" format (or paste a GitHub repository URL).';
        state.repoBrowser.status = '';
        renderApp();
        return;
      }

      state.repoConfig = parsed;
      saveRepoConfig();

      state.repoBrowser.loading = true;
      state.repoBrowser.error = '';
      state.repoBrowser.status = `Checking for catalog.json in ${parsed.ownerRepo}...`;
      renderApp();

      try {
        let effectiveBranch = parsed.branch;
        const catalogRelPath = parsed.path ? `${parsed.path}/catalog.json` : 'catalog.json';

        // 1. Fast path: probe raw catalog.json directly (1 raw GET, zero GitHub API quota).
        let catResp = await fetch(buildGitHubRawUrl(parsed.ownerRepo, effectiveBranch, catalogRelPath));
        if (catResp.status === 404 && effectiveBranch === 'main') {
          const masterCatResp = await fetch(buildGitHubRawUrl(parsed.ownerRepo, 'master', catalogRelPath));
          if (masterCatResp.ok) {
            catResp = masterCatResp;
            effectiveBranch = 'master';
            state.repoConfig.branch = 'master';
            saveRepoConfig();
          }
        }
        if (catResp.ok) {
          try {
            const catData = await catResp.json();
            if (catData && catData.format_version === 1 && Array.isArray(catData.packs)) {
              const enrichedPacks = catData.packs.map((p, idx) => {
                const packRelPath = parsed.path ? `${parsed.path}/${p.path}` : p.path;
                return {
                  ...p,
                  _idx: idx,
                  pack_key: `${p.kind || 'curriculum'}:${p.domain_slug || 'general'}/${p.id}`,
                  download_url: buildGitHubRawUrl(parsed.ownerRepo, effectiveBranch, packRelPath),
                };
              });
              const totalBytes = enrichedPacks.reduce((acc, p) => acc + (Number(p.size_bytes) || 0), 0);
              state.repoBrowser.catalog = {
                ...catData,
                packs: enrichedPacks,
              };
              state.repoBrowser.files = [];
              state.repoBrowser.loading = false;
              state.repoBrowser.status = `✓ Loaded catalog.json: ${enrichedPacks.length} ${catData.granularity || 'curriculum'} pack(s) (${catData.total_modules || 0} modules, ${formatByteSize(totalBytes)} total).`;
              renderApp();
              return;
            }
          } catch (_e) {
            // Fall through to Git Trees scan if catalog.json is not a Knowledge Knights catalog.
          }
        }

        // 2. Fallback: GitHub recursive Git Trees API for standalone .kkpack or .json trees.
        state.repoBrowser.catalog = null;
        state.repoBrowser.status = `Scanning modules & .kkpack archives in ${parsed.ownerRepo}...`;
        renderApp();

        let jsonFiles = null;
        const treeHeaders = { Accept: 'application/vnd.github.v3+json' };
        let treeResp = await fetch(
          `https://api.github.com/repos/${parsed.ownerRepo}/git/trees/${encodeURIComponent(effectiveBranch)}?recursive=1`,
          { headers: treeHeaders }
        );
        if (treeResp.status === 404 && effectiveBranch === 'main') {
          const masterTreeResp = await fetch(
            `https://api.github.com/repos/${parsed.ownerRepo}/git/trees/master?recursive=1`,
            { headers: treeHeaders }
          );
          if (masterTreeResp.ok) {
            treeResp = masterTreeResp;
            effectiveBranch = 'master';
            state.repoConfig.branch = 'master';
            saveRepoConfig();
          }
        }

        if (treeResp.ok) {
          const treeData = await treeResp.json();
          if (treeData && Array.isArray(treeData.tree) && !treeData.truncated) {
            jsonFiles = parseRepoTreeFiles(treeData.tree, parsed.ownerRepo, effectiveBranch, parsed.path);
          }
        }

        // 3. Final fallback: single-level /contents API if the tree response was unavailable or truncated.
        if (jsonFiles === null) {
          const encodedPath = parsed.path
            ? '/' + parsed.path.split('/').map(encodeURIComponent).join('/')
            : '';
          let apiUrl = `https://api.github.com/repos/${parsed.ownerRepo}/contents${encodedPath}?ref=${encodeURIComponent(effectiveBranch)}`;
          let resp = await fetch(apiUrl, { headers: treeHeaders });

          if (resp.status === 404 && effectiveBranch === 'main') {
            const fallbackUrl = `https://api.github.com/repos/${parsed.ownerRepo}/contents${encodedPath}?ref=master`;
            const fallbackResp = await fetch(fallbackUrl, { headers: treeHeaders });
            if (fallbackResp.ok) {
              resp = fallbackResp;
              effectiveBranch = 'master';
              state.repoConfig.branch = 'master';
              saveRepoConfig();
            }
          }

          if (!resp.ok) {
            throw new Error(`GitHub API returned HTTP ${resp.status}. Verify that the repository and folder path are public.`);
          }

          const data = await resp.json();
          const entries = Array.isArray(data) ? data : [data];
          jsonFiles = entries
            .filter(item => {
              if (!item || item.type !== 'file' || !item.download_url) return false;
              return isPackFilename(item.name) || (/\.json$/i.test(item.name) && !isNonModuleJsonPath(item.name));
            })
            .map(item => ({
              name: item.name,
              path: item.path,
              rel_path: item.name,
              folder: '',
              is_pack: isPackFilename(item.name),
              download_url: item.download_url,
              size: item.size || 0,
            }))
            .sort((a, b) => a.name.localeCompare(b.name));
        }

        state.repoBrowser.files = jsonFiles;
        const folderGroups = groupRepoFilesByFolder(jsonFiles);
        const nestedGroups = folderGroups.filter(g => g.folder !== '');
        if (nestedGroups.length > 3) {
          state.collapsedRepoFolders = new Set(folderGroups.map(g => g.folder));
        } else {
          state.collapsedRepoFolders = new Set();
        }
        state.repoBrowser.loading = false;
        const folderSummary = nestedGroups.length > 0 ? ` across ${folderGroups.length} folder(s)` : '';
        state.repoBrowser.status = jsonFiles.length > 0
          ? `Found ${jsonFiles.length} file(s)${folderSummary} in ${parsed.ownerRepo}.`
          : `No .kkpack or .json files found in "${parsed.path || '/'}" on branch "${state.repoConfig.branch}".`;
      } catch (err) {
        state.repoBrowser.loading = false;
        state.repoBrowser.error = err.message || String(err);
        state.repoBrowser.status = '';
      }
      renderApp();
    }

    async function cacheUnpackedModules(unpacked, packKey, expectedSha) {
      unpacked.modules.forEach(mod => {
        state.modulesById[mod.id] = mod;
        if (!state.activeModuleId) state.activeModuleId = mod.id;
      });
      const key = packKey || `${unpacked.manifest.kind || 'curriculum'}:${unpacked.manifest.domain_slug || 'general'}/${unpacked.manifest.id}`;
      state.installedPacks[key] = {
        sha256: expectedSha || unpacked.sha256 || '',
        title: unpacked.manifest.title || unpacked.manifest.id,
        module_ids: unpacked.modules.map(m => m.id),
        updated_at: nowRfc3339(),
      };
    }

    async function downloadCatalogPackByIndex(packIdx) {
      const cat = state.repoBrowser.catalog;
      if (!cat || !Array.isArray(cat.packs) || !cat.packs[packIdx]) return;
      await downloadCatalogPacksBatch([cat.packs[packIdx]], cat.packs[packIdx].title);
    }

    async function downloadCatalogPacksBatch(packs, batchLabel) {
      if (!Array.isArray(packs) || packs.length === 0) return;

      state.repoBrowser.loading = true;
      state.repoBrowser.error = '';
      let loadedPacks = 0;
      let loadedMods = 0;
      const errors = [];

      try {
        for (let i = 0; i < packs.length; i++) {
          const p = packs[i];
          const sizeLabel = p.size_bytes ? ` (${formatByteSize(p.size_bytes)})` : '';
          state.repoBrowser.status = packs.length === 1
            ? `Downloading ${p.title}${sizeLabel}...`
            : `Downloading pack ${i + 1}/${packs.length}: ${p.title}${sizeLabel}...`;
          renderApp();

          try {
            const resp = await fetch(p.download_url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const buf = await resp.arrayBuffer();
            const unpacked = await unpackKkpackArrayBuffer(buf, p.sha256);
            await cacheUnpackedModules(unpacked, p.pack_key, p.sha256);
            loadedPacks++;
            loadedMods += unpacked.modules.length;
          } catch (err) {
            errors.push(`${p.title}: ${err.message || err}`);
          }
        }

        await saveModules();
        saveInstalledPacks();
        savePrefs();
        reconcileCompletedBadges();
        state.repoBrowser.status = `✓ Unpacked ${loadedPacks} of ${packs.length} .kkpack bundle(s) (${loadedMods} module(s))${batchLabel && packs.length > 1 ? ` (${batchLabel})` : ''}.`;
        state.repoBrowser.error = errors.length > 0 ? `Failed packs: ${errors.join('; ')}` : '';
      } finally {
        state.repoBrowser.loading = false;
        renderApp();
      }
    }

    async function downloadOutdatedCatalogPacks() {
      const cat = state.repoBrowser.catalog;
      if (!cat || !Array.isArray(cat.packs)) return;
      const targets = cat.packs.filter(p => catalogPackStatus(p).state !== 'up_to_date');
      if (targets.length === 0) {
        state.repoBrowser.status = 'All catalog packs are already up to date on this device.';
        state.repoBrowser.error = '';
        renderApp();
        return;
      }
      await downloadCatalogPacksBatch(targets, 'new & updated');
    }

    async function downloadAllCatalogPacks() {
      const cat = state.repoBrowser.catalog;
      if (!cat || !Array.isArray(cat.packs)) return;
      await downloadCatalogPacksBatch(cat.packs, 'all packs');
    }

    async function fetchAndCacheModuleUrl(downloadUrl, label) {
      state.repoBrowser.loading = true;
      state.repoBrowser.error = '';
      state.repoBrowser.status = `Downloading ${label || downloadUrl}...`;
      renderApp();

      try {
        const resp = await fetch(downloadUrl);
        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status} while fetching ${label || downloadUrl}`);
        }
        const buf = await resp.arrayBuffer();
        if (isPackFilename(label) || isPackFilename(downloadUrl) || isZipBuffer(buf)) {
          const unpacked = await unpackKkpackArrayBuffer(buf, '');
          await cacheUnpackedModules(unpacked, '', '');
          await saveModules();
          saveInstalledPacks();
          savePrefs();
          reconcileCompletedBadges();
          state.repoBrowser.status = `✓ Unpacked "${unpacked.manifest.title}" (${unpacked.modules.length} module(s)).`;
        } else {
          const rawJson = JSON.parse(new TextDecoder('utf-8').decode(buf));
          const mod = validateAndNormalizeModule(rawJson);
          state.modulesById[mod.id] = mod;
          if (!state.activeModuleId) state.activeModuleId = mod.id;
          await saveModules();
          savePrefs();
          reconcileCompletedBadges();
          state.repoBrowser.status = `✓ Loaded "${mod.title}" (${mod.chunk_count} chunks, ${mod.question_count} questions).`;
        }
      } catch (err) {
        state.repoBrowser.error = `Failed to load ${label || 'module'}: ${err.message || err}`;
        state.repoBrowser.status = '';
      } finally {
        state.repoBrowser.loading = false;
        renderApp();
      }
    }

    async function loadGitHubFilesBatch(files, batchLabel) {
      if (!Array.isArray(files) || files.length === 0) return;

      state.repoBrowser.loading = true;
      state.repoBrowser.error = '';
      let loadedModules = 0;
      let completedCount = 0;
      const errors = [];
      const concurrency = 4;
      let nextIdx = 0;

      const worker = async () => {
        while (nextIdx < files.length) {
          const i = nextIdx++;
          const f = files[i];
          try {
            const resp = await fetch(f.download_url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const buf = await resp.arrayBuffer();
            if (f.is_pack || isZipBuffer(buf)) {
              const unpacked = await unpackKkpackArrayBuffer(buf, '');
              await cacheUnpackedModules(unpacked, '', '');
              loadedModules += unpacked.modules.length;
            } else {
              const rawJson = JSON.parse(new TextDecoder('utf-8').decode(buf));
              const mod = validateAndNormalizeModule(rawJson);
              state.modulesById[mod.id] = mod;
              if (!state.activeModuleId) state.activeModuleId = mod.id;
              loadedModules++;
            }
          } catch (err) {
            errors.push(`${f.name}: ${err.message || err}`);
          } finally {
            completedCount++;
            if (completedCount === 1 || completedCount % 4 === 0 || completedCount === files.length) {
              state.repoBrowser.status = `Loading ${batchLabel || 'files'} (${completedCount}/${files.length}): ${f.name}...`;
              renderApp();
            }
          }
        }
      };

      try {
        const workers = [];
        for (let w = 0; w < Math.min(concurrency, files.length); w++) {
          workers.push(worker());
        }
        await Promise.all(workers);

        await saveModules();
        saveInstalledPacks();
        savePrefs();
        reconcileCompletedBadges();
        state.repoBrowser.status = `✓ Loaded ${loadedModules} module(s) from ${files.length} file(s)${batchLabel ? ` (${batchLabel})` : ''}.`;
        state.repoBrowser.error = errors.length > 0 ? `Skipped non-module/invalid files: ${errors.join('; ')}` : '';
      } finally {
        state.repoBrowser.loading = false;
        renderApp();
      }
    }

    async function loadAllGitHubFiles() {
      const files = state.repoBrowser.files || [];
      await loadGitHubFilesBatch(files, 'all');
    }

    async function loadMissingGitHubFiles() {
      const files = (state.repoBrowser.files || []).filter(f => f.is_pack || !state.modulesById[moduleIdFromFilename(f.name)]);
      if (files.length === 0) {
        state.repoBrowser.status = 'All discovered repository modules are already cached on this device.';
        state.repoBrowser.error = '';
        renderApp();
        return;
      }
      await loadGitHubFilesBatch(files, 'new files');
    }

    async function loadRepoFolder(event, folderKey, onlyMissing) {
      if (event) event.stopPropagation();
      const folderFiles = (state.repoBrowser.files || []).filter(f => String(f.folder || '') === folderKey);
      const targets = onlyMissing
        ? folderFiles.filter(f => f.is_pack || !state.modulesById[moduleIdFromFilename(f.name)])
        : folderFiles;
      if (targets.length === 0) return;
      const label = folderKey ? folderKey.split('/').join(' / ') : 'root';
      await loadGitHubFilesBatch(targets, label);
    }

    async function loadRawUrlInput() {
      const input = document.getElementById('rawModuleUrlInput');
      if (!input || !input.value.trim()) return;
      let url = input.value.trim();
      // Convert github.com/.../blob/... to raw.githubusercontent.com automatically
      const blobMatch = url.match(/^https?:\/\/github\.com\/([^/]+\/[^/]+)\/blob\/(.+)$/i);
      if (blobMatch) {
        url = `https://raw.githubusercontent.com/${blobMatch[1]}/${blobMatch[2]}`;
      }
      await fetchAndCacheModuleUrl(url, url.split('/').pop());
    }

    async function handleLocalFilesSelected(fileList) {
      if (!fileList || fileList.length === 0) return;
      let loadedModules = 0;
      let loadedPacks = 0;
      const errors = [];
      for (let i = 0; i < fileList.length; i++) {
        const file = fileList[i];
        try {
          const buf = await file.arrayBuffer();
          if (isPackFilename(file.name) || /\.zip$/i.test(file.name) || isZipBuffer(buf)) {
            const unpacked = await unpackKkpackArrayBuffer(buf, '');
            await cacheUnpackedModules(unpacked, '', '');
            loadedPacks++;
            loadedModules += unpacked.modules.length;
          } else {
            const raw = JSON.parse(new TextDecoder('utf-8').decode(buf));
            const mod = validateAndNormalizeModule(raw);
            state.modulesById[mod.id] = mod;
            if (!state.activeModuleId) state.activeModuleId = mod.id;
            loadedModules++;
          }
        } catch (err) {
          errors.push(`${file.name}: ${err.message || err}`);
        }
      }
      await saveModules();
      saveInstalledPacks();
      savePrefs();
      reconcileCompletedBadges();
      if (loadedModules > 0) {
        const packNote = loadedPacks > 0 ? ` (${loadedPacks} .kkpack archive(s))` : '';
        state.repoBrowser.status = `✓ Imported ${loadedModules} module(s)${packNote} into device cache.`;
      } else {
        state.repoBrowser.status = '';
      }
      state.repoBrowser.error = errors.length > 0 ? errors.join(' | ') : '';
      renderApp();
    }

    function renderCatalogBrowserHtml(catalog, loading) {
      const packs = Array.isArray(catalog.packs) ? catalog.packs : [];
      if (packs.length === 0) return '';

      const outdatedPacks = packs.filter(p => catalogPackStatus(p).state !== 'up_to_date');
      const totalBytes = packs.reduce((sum, p) => sum + (Number(p.size_bytes) || 0), 0);
      const outdatedBytes = outdatedPacks.reduce((sum, p) => sum + (Number(p.size_bytes) || 0), 0);

      const byDomain = new Map();
      packs.forEach(p => {
        const dom = String(p.domain_title || p.domain_slug || 'General');
        if (!byDomain.has(dom)) byDomain.set(dom, []);
        byDomain.get(dom).push(p);
      });
      const domainNames = Array.from(byDomain.keys()).sort((a, b) => a.localeCompare(b));

      const domainsHtml = domainNames.map(dom => {
        const domPacks = byDomain.get(dom);
        const cardsHtml = domPacks.map(p => {
          const st = catalogPackStatus(p);
          const sizeStr = formatByteSize(p.size_bytes);
          let chipHtml = '';
          let btnLabel = `⬇️ Download (${sizeStr})`;
          let btnClass = 'btn-blue';
          if (st.state === 'up_to_date') {
            chipHtml = '<span class="cached-chip">✓ Up to date</span>';
            btnLabel = '↻ Reinstall';
            btnClass = '';
          } else if (st.state === 'update') {
            chipHtml = '<span class="update-chip">↑ Update</span>';
            btnLabel = `⬆️ Update (${sizeStr})`;
            btnClass = 'btn-primary';
          }
          const arcCount = Number(p.arc_count) || (Array.isArray(p.arcs) ? p.arcs.length : 1);
          const arcsPreview = Array.isArray(p.arcs) && p.arcs.length > 1
            ? `<div class="catalog-pack-arcs">
                 ${p.arcs.map(a => `<span>• ${escapeHtml(a.arc_title || a.arc_id)} (${(a.module_ids || []).length})</span>`).join('')}
               </div>`
            : '';
          return `
            <div class="catalog-pack-card ${st.state === 'up_to_date' ? 'up-to-date' : ''}">
              <div class="catalog-pack-top">
                <div style="min-width:0;flex:1">
                  <div class="catalog-pack-title">${escapeHtml(p.title || p.id)}${chipHtml}</div>
                  <div class="catalog-pack-meta">
                    ${p.module_count} module(s) · ${arcCount} arc(s) · ${sizeStr} · ${st.cachedCount}/${st.totalCount} cached
                  </div>
                </div>
                <button type="button" class="btn-sm ${btnClass}" style="flex-shrink:0" ${loading ? 'disabled' : ''} onclick="downloadCatalogPackByIndex(${p._idx})">
                  ${btnLabel}
                </button>
              </div>
              ${arcsPreview}
            </div>
          `;
        }).join('');
        return `
          <div class="catalog-domain-group">
            <div class="catalog-domain-header">${escapeHtml(dom)} (${domPacks.length})</div>
            ${cardsHtml}
          </div>
        `;
      }).join('');

      return `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px">
          <span style="font-size:0.8rem;color:var(--text-muted);font-weight:700">
            📦 ${packs.length} .kkpack Bundle(s) · ${catalog.total_modules || 0} Modules · ${formatByteSize(totalBytes)}
          </span>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${outdatedPacks.length > 0 && outdatedPacks.length < packs.length ? `
              <button type="button" class="btn-sm btn-primary" ${loading ? 'disabled' : ''} onclick="downloadOutdatedCatalogPacks()">
                ⬇️ New / Updated (${outdatedPacks.length} · ${formatByteSize(outdatedBytes)})
              </button>
            ` : ''}
            <button type="button" class="btn-sm ${outdatedPacks.length === packs.length ? 'btn-primary' : ''}" ${loading ? 'disabled' : ''} onclick="downloadAllCatalogPacks()">
              ${outdatedPacks.length === 0 ? `↻ Reinstall All (${packs.length})` : `⬇️ Download All (${formatByteSize(totalBytes)})`}
            </button>
          </div>
        </div>
        <div class="repo-file-list">
          ${domainsHtml}
        </div>
      `;
    }

    function renderRepoFileRowHtml(f, loading) {
      const sizeStr = f.size ? formatByteSize(f.size) : (f.is_pack ? 'KKPACK' : 'JSON');
      const safeUrl = escapeJsAttr(f.download_url);
      const safeName = escapeJsAttr(f.name);
      const cachedMod = !f.is_pack && state.modulesById[moduleIdFromFilename(f.name)];
      const cachedBadge = cachedMod
        ? '<span class="cached-chip">✓ Cached</span>'
        : (f.is_pack ? '<span class="part-pill" style="margin-left:6px">.kkpack</span>' : '');
      const btnText = f.is_pack ? '⬇️ Unpack' : (cachedMod ? '↻ Update' : 'Load');
      return `
        <div class="repo-file-item">
          <div class="repo-file-meta">
            <div class="repo-file-name">${escapeHtml(f.name)}${cachedBadge}</div>
            <div class="repo-file-sub">${escapeHtml(f.rel_path || f.path)} · ${sizeStr}</div>
          </div>
          <button type="button" class="btn-sm ${cachedMod ? '' : 'btn-blue'}" ${loading ? 'disabled' : ''} onclick="fetchAndCacheModuleUrl('${safeUrl}', '${safeName}')">
            ${btnText}
          </button>
        </div>
      `;
    }

    function renderLibraryTab(container) {
      const rb = state.repoBrowser;
      const cachedMods = Object.values(state.modulesById).sort((a, b) => {
        const cA = (a.curriculum_title || a.curriculum_id || a.tag_path_key || '').toLowerCase();
        const cB = (b.curriculum_title || b.curriculum_id || b.tag_path_key || '').toLowerCase();
        if (cA !== cB) return cA.localeCompare(cB);

        const seqA = a.sequence_index || Number.MAX_SAFE_INTEGER;
        const seqB = b.sequence_index || Number.MAX_SAFE_INTEGER;
        if (seqA !== seqB) return seqA - seqB;
        return (a.title || '').localeCompare(b.title || '');
      });

    // =========================================================================
    // 9. TAB 4: SYNC / CUT-AND-PASTE CROSS-DEVICE STATE TRANSFER
    // =========================================================================
    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) {
        bin += String.fromCharCode(bytes[i]);
      }
      return btoa(bin);
    }

    function base64ToUtf8(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function buildExportPayloadObject() {
      return {
        version: 1,
        exported_at: nowRfc3339(),
        repo_config: state.repoConfig,
        hide_mastered: state.hideMastered,
        profile: state.profile,
        sessions: state.sessions,
      };
    }

    function generateTransferString(asRawJson) {
      const payload = buildExportPayloadObject();
      if (asRawJson) {
        return JSON.stringify(payload, null, 2);
      }
      return 'KK1:' + utf8ToBase64(JSON.stringify(payload));
    }

    function parseTransferString(rawInput) {
      const trimmed = String(rawInput || '').trim();
      if (!trimmed) {
        throw new Error('Please paste a transfer code or JSON snapshot first.');
      }
      let jsonStr = trimmed;
      if (trimmed.startsWith('KK1:')) {
        const b64Part = trimmed.slice(4).replace(/\s+/g, '');
        try {
          jsonStr = base64ToUtf8(b64Part);
        } catch (_e) {
          throw new Error('Invalid KK1 Base64 transfer code. Ensure the entire code was copied.');
        }
      } else if (!trimmed.startsWith('{')) {
        try {
          jsonStr = base64ToUtf8(trimmed.replace(/\s+/g, ''));
        } catch (_e) {
          throw new Error('Unrecognized transfer format. Paste a KK1:... code or JSON object.');
        }
      }

      let data;
      try {
        data = JSON.parse(jsonStr);
      } catch (_e) {
        throw new Error('Transfer payload is not valid JSON.');
      }
      if (!data || typeof data !== 'object') {
        throw new Error('Transfer payload must be an object.');
      }
      return data;
    }

    // Progress rank comparison for Smart Merge
    function sessionProgressScore(s) {
      if (!s || typeof s !== 'object') return [0, 0, 0];
      if (s.phase === PHASE_COMPLETED) {
        return [3, s.exam_mastered_count || 100, s.exam_total_attempts || 0];
      }
      if (s.phase === PHASE_FINAL_EXAM) {
        return [2, s.exam_mastered_count || 0, s.exam_total_attempts || 0];
      }
      const answeredLen = Array.isArray(s.answered_in_chunk) ? s.answered_in_chunk.length : 0;
      return [1, s.current_chunk_index || 0, answeredLen];
    }

    function isSessionFurtherAhead(candidate, current) {
      if (!current) return true;
      if (!candidate) return false;
      const a = sessionProgressScore(candidate);
      const b = sessionProgressScore(current);
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return a[i] > b[i];
      }
      return false;
    }

    function applyImportedPayload(data, mode) {
      const incomingBadges = (data.profile && Array.isArray(data.profile.badges))
        ? data.profile.badges
        : [];
      const incomingSessions = (data.sessions && typeof data.sessions === 'object')
        ? data.sessions
        : {};

      if (mode === 'replace') {
        state.profile = { badges: incomingBadges };
        state.sessions = incomingSessions;
        if (data.repo_config && typeof data.repo_config === 'object') {
          state.repoConfig = {
            ownerRepo: String(data.repo_config.ownerRepo || ''),
            path: String(data.repo_config.path || ''),
            branch: String(data.repo_config.branch || 'main'),
          };
        }
        if (typeof data.hide_mastered === 'boolean') {
          state.hideMastered = data.hide_mastered;
        }
      } else {
        // Smart Merge: union badges by module_id (keeping earliest awarded_at)
        const mergedBadgesById = {};
        (state.profile.badges || []).forEach(b => {
          if (b && b.module_id) mergedBadgesById[b.module_id] = { ...b };
        });
        incomingBadges.forEach(b => {
          if (!b || !b.module_id) return;
          const existing = mergedBadgesById[b.module_id];
          if (!existing) {
            mergedBadgesById[b.module_id] = {
              module_id: String(b.module_id),
              module_title: String(b.module_title || b.module_id),
              tag_path: normalizeTagPath(b.tag_path),
              awarded_at: String(b.awarded_at || nowRfc3339()),
            };
          } else if (b.awarded_at && (!existing.awarded_at || compareIsoTimestamps(b.awarded_at, existing.awarded_at) < 0)) {
            existing.awarded_at = b.awarded_at;
          }
        });
        state.profile.badges = Object.values(mergedBadgesById);

        // Smart Merge sessions: keep whichever session per module has progressed further,
        // preserving the earliest started_at and latest last_studied_at across copies.
        Object.entries(incomingSessions).forEach(([modId, incSess]) => {
          if (!incSess || typeof incSess !== 'object') return;
          const localSess = state.sessions[modId];
          const mergedStartedAt = earliestTimestamp(localSess && localSess.started_at, incSess.started_at);
          const mergedLastStudiedAt = latestTimestamp(localSess && localSess.last_studied_at, incSess.last_studied_at);
          if (isSessionFurtherAhead(incSess, localSess)) {
            const merged = { ...incSess };
            if (mergedStartedAt) merged.started_at = mergedStartedAt;
            if (mergedLastStudiedAt) merged.last_studied_at = mergedLastStudiedAt;
            state.sessions[modId] = merged;
          } else if (localSess && (
            (localSess.started_at || '') !== mergedStartedAt ||
            (localSess.last_studied_at || '') !== mergedLastStudiedAt
          )) {
            localSess.started_at = mergedStartedAt;
            localSess.last_studied_at = mergedLastStudiedAt;
          }
        });

        if (!state.repoConfig.ownerRepo && data.repo_config && data.repo_config.ownerRepo) {
          state.repoConfig = {
            ownerRepo: String(data.repo_config.ownerRepo || ''),
            path: String(data.repo_config.path || ''),
            branch: String(data.repo_config.branch || 'main'),
          };
        }
      }

      reconcileCompletedBadges();
      saveProfile();
      saveSessions();
      saveRepoConfig();
      savePrefs();
    }

    async function copyExportTransferCode() {
      const box = document.getElementById('exportCodeBox');
      if (!box) return;
      const text = box.value;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          box.focus();
          box.select();
          document.execCommand('copy');
        }
        state.syncView.status = '✓ Transfer code copied to clipboard!';
        state.syncView.statusKind = 'ok';
      } catch (_e) {
        box.focus();
        box.select();
        state.syncView.status = 'Selected transfer code — use Copy on your device.';
        state.syncView.statusKind = 'info';
      }
      renderApp();
    }

    function handleImportTransferCode() {
      const box = document.getElementById('importCodeBox');

        const data = parseTransferString(raw);

        const badgeCount = (state.profile.badges || []).length;
        const sessCount = Object.keys(state.sessions || {}).length;
        state.syncView.status = `✓ Imported successfully (${state.syncView.importMode === 'merge' ? 'Smart Merge' : 'Replace All'}): ${badgeCount} Badge(s), ${sessCount} Module Session(s).`;
        state.syncView.statusKind = 'ok';
      } catch (err) {
        state.syncView.status = `✗ Import failed: ${err.message || err}`;
        state.syncView.statusKind = 'err';
      }
      renderApp();
    }

          <div class="field-group">

    // =========================================================================
    // 9B. TAB 4: PROGRESS REPORT GENERATOR (matches report/report.go)
    // =========================================================================
    const REPORT_MONTH_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const REPORT_MONTH_LONG = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December',
    ];

    function formatUtcDateInput(dateObj) {
      const y = dateObj.getUTCFullYear();
      const m = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getUTCDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseReportDateMs(raw, endOfDay) {
      const clean = String(raw || '').trim();
      if (!clean) return null;
      const dateOnly = clean.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (dateOnly) {
        const y = Number(dateOnly[1]);
        const mo = Number(dateOnly[2]) - 1;
        const d = Number(dateOnly[3]);
        const ms = endOfDay
          ? Date.UTC(y, mo, d, 23, 59, 59)
          : Date.UTC(y, mo, d, 0, 0, 0);
        const verify = new Date(ms);
        if (verify.getUTCFullYear() !== y || verify.getUTCMonth() !== mo || verify.getUTCDate() !== d) {
          return null;
        }
        return ms;
      }
      const parsed = Date.parse(clean);
      return Number.isNaN(parsed) ? null : parsed;
    }

    function formatUtcShortDate(ms, includeYear) {
      const dt = new Date(ms);
      const base = `${REPORT_MONTH_SHORT[dt.getUTCMonth()]} ${dt.getUTCDate()}`;
      return includeYear ? `${base}, ${dt.getUTCFullYear()}` : base;
    }

    function formatReportDateSpan(startMs, endMs) {
      const s = new Date(startMs);
      const e = new Date(endMs);
      if (s.getUTCFullYear() === e.getUTCFullYear()) {
        if (s.getUTCMonth() === e.getUTCMonth() && s.getUTCDate() === e.getUTCDate()) {
          return formatUtcShortDate(endMs, true);
        }
        return `${formatUtcShortDate(startMs, false)} – ${formatUtcShortDate(endMs, true)}`;
      }
      return `${formatUtcShortDate(startMs, true)} – ${formatUtcShortDate(endMs, true)}`;
    }

    function resolveLocalReportWindow(preset, startStr, endStr, nowDate) {
      const now = nowDate instanceof Date ? nowDate : new Date();
      const nowMs = now.getTime();
      const cleanPreset = String(preset || 'last_7_days').toLowerCase().trim() || 'last_7_days';

      if (cleanPreset === 'last_7_days') {
        const startMs = Date.UTC(
          now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - 7,
          now.getUTCHours(), now.getUTCMinutes(), now.getUTCSeconds()
        );
        return { preset: cleanPreset, startMs, endMs: nowMs, label: `Last 7 Days (${formatReportDateSpan(startMs, nowMs)})`, error: '' };
      }
      if (cleanPreset === 'last_30_days') {
        const startMs = Date.UTC(
          now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - 30,
          now.getUTCHours(), now.getUTCMinutes(), now.getUTCSeconds()
        );
        return { preset: cleanPreset, startMs, endMs: nowMs, label: `Last 30 Days (${formatReportDateSpan(startMs, nowMs)})`, error: '' };
      }
      if (cleanPreset === 'this_month') {
        const startMs = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1, 0, 0, 0);
        return { preset: cleanPreset, startMs, endMs: nowMs, label: `${REPORT_MONTH_LONG[now.getUTCMonth()]} ${now.getUTCFullYear()}`, error: '' };
      }
      if (cleanPreset === 'this_quarter') {
        const qMonth = Math.floor(now.getUTCMonth() / 3) * 3;
        const qNum = Math.floor(now.getUTCMonth() / 3) + 1;
        const startMs = Date.UTC(now.getUTCFullYear(), qMonth, 1, 0, 0, 0);
        return { preset: cleanPreset, startMs, endMs: nowMs, label: `Q${qNum} ${now.getUTCFullYear()}`, error: '' };
      }
      if (cleanPreset === 'all_time') {
        return { preset: cleanPreset, startMs: null, endMs: nowMs, label: 'All Time', error: '' };
      }
      if (cleanPreset === 'custom') {
        let startMs = null;
        if (String(startStr || '').trim()) {
          startMs = parseReportDateMs(startStr, false);
          if (startMs === null) {
            return { preset: cleanPreset, startMs: null, endMs: nowMs, label: 'Custom Range', error: `Invalid start date "${startStr}".` };
          }
        }
        let endMs = nowMs;
        if (String(endStr || '').trim()) {
          endMs = parseReportDateMs(endStr, true);
          if (endMs === null) {
            return { preset: cleanPreset, startMs, endMs: nowMs, label: 'Custom Range', error: `Invalid end date "${endStr}".` };
          }
        }
        if (startMs !== null && startMs > endMs) {
          return { preset: cleanPreset, startMs, endMs, label: 'Custom Range', error: 'Start date must be on or before end date.' };
        }
        const label = startMs !== null
          ? formatReportDateSpan(startMs, endMs)
          : `Through ${formatUtcShortDate(endMs, true)}`;
        return { preset: cleanPreset, startMs, endMs, label, error: '' };
      }
      return { preset: 'last_7_days', startMs: null, endMs: nowMs, label: 'All Time', error: `Unsupported preset "${preset}".` };
    }

    function matchesReportTagBranch(modKey, prefixKey) {
      if (!prefixKey) return true;
      return modKey === prefixKey || modKey.startsWith(prefixKey + ' / ');
    }

    function formatIntWithCommas(n) {
      return Math.round(Number(n || 0)).toLocaleString('en-US');
    }

    function pluralizeWord(n, singular, plural) {
      return n === 1 ? singular : plural;
    }

    function openerReportPhrase(windowLabel) {
      if (String(windowLabel || '').toLowerCase() === 'all time') {
        return 'all of my study sessions so far';
      }
      if (String(windowLabel || '').startsWith('Last ')) {
        return 'the ' + windowLabel.charAt(0).toLowerCase() + windowLabel.slice(1);
      }
      return windowLabel;
    }

    function buildLocalProgressReport(nowDate) {
      const rv = state.reportView;
      const win = resolveLocalReportWindow(rv.preset, rv.customStart, rv.customEnd, nowDate || new Date());
      if (win.error) {
        return { error: win.error, report: null };
      }
      const tagFilterKey = rv.tagPrefix ? tagPathKey(String(rv.tagPrefix).split('/')) : '';

      // Deduplicate badges by module_id keeping earliest parseable awarded_at.
      const badgesByMod = {};
      (state.profile.badges || []).forEach(b => {
        if (!b || !b.module_id) return;
        const modId = String(b.module_id).trim();
        if (!modId) return;
        const tsMs = parseReportDateMs(b.awarded_at, false);
        const mod = state.modulesById[modId];
        const tagPath = (mod && Array.isArray(mod.tag_path) && mod.tag_path.length > 0)
          ? mod.tag_path.slice()
          : normalizeTagPath(b.tag_path);
        const prev = badgesByMod[modId];
        if (!prev || (tsMs !== null && (prev.tsMs === null || tsMs < prev.tsMs))) {
          badgesByMod[modId] = { badge: b, tsMs, tagPath };
        }
      });

      const beforeAll = new Set();
      const afterAll = new Set();
      const beforeByBranch = {};
      const afterByBranch = {};
      const touchedBranches = new Set();
      const inWindowModIDs = new Set();

      const addBranch = (mapObj, key, modId) => {
        if (!mapObj[key]) mapObj[key] = new Set();
        mapObj[key].add(modId);
      };

      const completed = [];
      let totalQuestions = 0;
      let totalAccSum = 0;
      let accSamples = 0;

      Object.entries(badgesByMod).forEach(([modId, rec]) => {
        if (rec.tsMs !== null && rec.tsMs > win.endMs) {
          return;
        }
        let isBefore = win.startMs !== null && rec.tsMs !== null && rec.tsMs < win.startMs;
        let isInWindow = !isBefore;
        if (win.startMs !== null && rec.tsMs === null) {
          isBefore = true;
          isInWindow = false;
        }

        afterAll.add(modId);
        if (isBefore) beforeAll.add(modId);
        for (let depth = 1; depth <= rec.tagPath.length; depth++) {
          const bk = tagPathKey(rec.tagPath.slice(0, depth));
          addBranch(afterByBranch, bk, modId);
          if (isBefore) addBranch(beforeByBranch, bk, modId);
          if (isInWindow) touchedBranches.add(bk);
        }

        if (!isInWindow) return;
        const modTagKey = tagPathKey(rec.tagPath);
        if (tagFilterKey && !matchesReportTagBranch(modTagKey, tagFilterKey)) return;

        inWindowModIDs.add(modId);
        const mod = state.modulesById[modId];
        const sess = state.sessions[modId];
        const qCount = (mod && mod.question_count > 0) ? mod.question_count : 100;
        const secTitles = [];
        const terms = [];
        const seenTerms = new Set();
        if (mod && Array.isArray(mod.sections)) {
          mod.sections.forEach(sec => {
            if (sec && String(sec.title || '').trim()) {
              secTitles.push(String(sec.title).trim());
            }
            ((sec && sec.introduced_terms) || []).forEach(t => {
              const clean = String(t || '').trim();
              if (clean && !seenTerms.has(clean.toLowerCase()) && terms.length < 8) {
                seenTerms.add(clean.toLowerCase());
                terms.push(clean);
              }
            });
          });
        }
        let attempts = 0;
        let accPct = 0;
        if (sess && sess.exam_total_attempts >= qCount && qCount > 0) {
          attempts = sess.exam_total_attempts;
          accPct = Math.round((qCount / attempts) * 1000) / 10;
        }
        const cm = {
          module_id: modId,
          title: (mod && mod.title) || rec.badge.module_title || modId,
          summary: (mod && mod.summary) || '',
          tag_path: rec.tagPath,
          tag_path_key: modTagKey,
          curriculum_id: (mod && mod.curriculum_id) || '',
          curriculum_title: (mod && mod.curriculum_title) || '',
          arc_id: (mod && mod.arc_id) || '',
          arc_title: (mod && mod.arc_title) || '',
          sequence_index: (mod && mod.sequence_index) || 0,
          awarded_at: String(rec.badge.awarded_at || '').trim(),
          question_count: qCount,
          exam_total_attempts: attempts,
          accuracy_pct: accPct,
          section_titles: secTitles,
          highlight_terms: terms,
        };
        totalQuestions += cm.question_count;
        if (cm.accuracy_pct > 0) {
          totalAccSum += cm.accuracy_pct;
          accSamples++;
        }
        completed.push(cm);
      });

      completed.sort((a, b) => {
        if (a.awarded_at !== b.awarded_at) return a.awarded_at.localeCompare(b.awarded_at);
        return a.module_id.localeCompare(b.module_id);
      });

      // Rank promotions (Overall + per-branch).
      const promotions = [];
      if (!tagFilterKey) {
        const bLvl = levelForBadges(beforeAll.size);
        const aLvl = levelForBadges(afterAll.size);
        if (aLvl.level > bLvl.level) {
          promotions.push({
            scope: 'Overall',
            is_overall: true,
            before_level: bLvl.level,
            before_title: bLvl.title,
            after_level: aLvl.level,
            after_title: aLvl.title,
            badges_after: aLvl.badges,
          });
        }
      }
      Array.from(touchedBranches).sort((a, b) => a.localeCompare(b)).forEach(bk => {
        if (tagFilterKey && !matchesReportTagBranch(bk, tagFilterKey)) return;
        const bCnt = beforeByBranch[bk] ? beforeByBranch[bk].size : 0;
        const aCnt = afterByBranch[bk] ? afterByBranch[bk].size : 0;
        const bLvl = levelForBadges(bCnt);
        const aLvl = levelForBadges(aCnt);
        if (aLvl.level > bLvl.level) {
          promotions.push({
            scope: bk,
            is_overall: false,
            before_level: bLvl.level,
            before_title: bLvl.title,
            after_level: aLvl.level,
            after_title: aLvl.title,
            badges_after: aLvl.badges,
          });
        }
      });

      // Arc totals & completed arcs across cached library modules.
      const arcsByKey = {};
      Object.values(state.modulesById).forEach(mod => {
        if (!mod) return;
        const key = moduleGroupKey(mod);
        if (!key) return;
        if (!arcsByKey[key]) {
          arcsByKey[key] = {
            currID: String(mod.curriculum_id || '').trim(),
            currTitle: String(mod.curriculum_title || '').trim(),
            arcID: String(mod.arc_id || '').trim(),
            arcTitle: String(mod.arc_title || '').trim(),
            total: 0,
            mastered: 0,
            hasInWin: false,
          };
        }
        arcsByKey[key].total++;
        if (afterAll.has(mod.id)) arcsByKey[key].mastered++;
        if (inWindowModIDs.has(mod.id)) arcsByKey[key].hasInWin = true;
      });

      const completedArcs = [];
      const completedArcKeys = new Set();
      Object.entries(arcsByKey).forEach(([key, at]) => {
        if (at.total > 0 && at.mastered === at.total && at.hasInWin) {
          completedArcKeys.add(key);
          completedArcs.push({
            curriculum_id: at.currID,
            curriculum_title: at.currTitle,
            arc_id: at.arcID,
            arc_title: at.arcTitle || at.currTitle || at.arcID,
            total_modules: at.total,
          });
        }
      });

      // Group completed modules by Curriculum + Arc.
      const groupMap = {};
      completed.forEach(cm => {
        const key = (cm.curriculum_id || cm.arc_id) ? `${cm.curriculum_id}::${cm.arc_id}` : '';
        const groupKey = key || `standalone::${cm.tag_path_key}`;
        if (!groupMap[groupKey]) {
          const at = arcsByKey[key];
          groupMap[groupKey] = {
            curriculum_id: cm.curriculum_id,
            curriculum_title: cm.curriculum_title,
            arc_id: cm.arc_id,
            arc_title: cm.arc_title || cm.curriculum_title || cm.tag_path_key,
            tag_path_key: cm.tag_path_key,
            arc_mastered: at ? at.mastered : 0,
            arc_total: at ? at.total : 0,
            arc_completed_now: completedArcKeys.has(key),
            modules: [],
          };
        }
        groupMap[groupKey].modules.push(cm);
      });

      const seqKey = (n) => (n > 0 ? n : 1e9);
      const groups = Object.values(groupMap).map(g => {
        g.modules.sort((a, b) => {
          const sa = seqKey(a.sequence_index);
          const sb = seqKey(b.sequence_index);
          if (sa !== sb) return sa - sb;
          if (a.awarded_at !== b.awarded_at) return a.awarded_at.localeCompare(b.awarded_at);
          return a.title.localeCompare(b.title);
        });
        if (g.arc_total === 0) {
          g.arc_total = g.modules.length;
          g.arc_mastered = g.modules.length;
        }
        return g;
      });
      groups.sort((a, b) => {
        if (a.arc_completed_now !== b.arc_completed_now) return a.arc_completed_now ? -1 : 1;
        if (a.curriculum_title !== b.curriculum_title) return a.curriculum_title.localeCompare(b.curriculum_title);
        return a.arc_title.localeCompare(b.arc_title);
      });

      // Active in-progress sessions within [startMs, endMs].
      const inProgress = [];
      if (rv.includeInProgress) {
        Object.entries(state.sessions || {}).forEach(([modId, sess]) => {
          if (!sess || sess.phase === PHASE_COMPLETED || afterAll.has(modId)) return;
          const actStr = String(sess.last_studied_at || sess.started_at || '').trim();
          const actMs = parseReportDateMs(actStr, false);
          if (actMs === null) return;
          if ((win.startMs !== null && actMs < win.startMs) || actMs > win.endMs) return;
          const mod = state.modulesById[modId];
          if (!mod) return;
          const tKey = mod.tag_path_key || tagPathKey(mod.tag_path);
          if (tagFilterKey && !matchesReportTagBranch(tKey, tagFilterKey)) return;
          const totalChunks = mod.chunk_count > 0 ? mod.chunk_count : 50;
          const totalQ = mod.question_count > 0 ? mod.question_count : 100;
          let label = '';
          let pct = 2;
          if (sess.phase === PHASE_FINAL_EXAM) {
            const mastered = sess.exam_mastered_count || 0;
            pct = Math.min(99, Math.round(50 + (mastered / totalQ) * 50));
            label = `Final Exam: ${mastered}/${totalQ} mastered`;
          } else {
            const idx = sess.current_chunk_index || 0;
            const num = Math.min(totalChunks, idx + 1);
            pct = Math.max(2, Math.round((idx / totalChunks) * 50));
            label = `Chunk ${num}/${totalChunks}`;
          }
          inProgress.push({
            module_id: modId,
            title: mod.title,
            tag_path_key: tKey,
            phase: sess.phase,
            progress_label: label,
            progress_pct: pct,
            last_studied_at: new Date(actMs).toISOString().replace(/\.\d{3}Z$/, 'Z'),
          });
        });
        inProgress.sort((a, b) => {
          if (a.last_studied_at !== b.last_studied_at) return b.last_studied_at.localeCompare(a.last_studied_at);
          return a.title.localeCompare(b.title);
        });
      }

      const avgAcc = accSamples > 0 ? Math.round((totalAccSum / accSamples) * 10) / 10 : 0;
      return {
        error: '',
        report: {
          preset: win.preset,
          window_label: win.label,
          tag_filter: tagFilterKey,
          metrics: {
            modules_mastered_count: completed.length,
            questions_conquered: totalQuestions,
            average_exam_accuracy_pct: avgAcc,
            arcs_completed_count: completedArcs.length,
            in_progress_count: inProgress.length,
            total_badges_before: beforeAll.size,
            total_badges_after: afterAll.size,
          },
          promotions,
          completed_arcs: completedArcs,
          groups,
          completed_modules: completed,
          in_progress: inProgress,
        },
      };
    }

    function formatLocalReportFacebook(r) {
      if (!r) return '';
      const out = [];
      const scope = r.tag_filter ? ` · ${r.tag_filter}` : '';
      out.push(`🛡️ Knowledge Knights Learning Log — ${r.window_label}${scope}\n\n`);
      if (r.metrics.modules_mastered_count === 0 && r.metrics.in_progress_count === 0) {
        out.push('Quiet study window with no completed modules logged yet — next quest coming soon!\n');
        return out.join('');
      }
      if (r.metrics.modules_mastered_count > 0) {
        let opener = `Over ${openerReportPhrase(r.window_label)}, I mastered ${r.metrics.modules_mastered_count} ${pluralizeWord(r.metrics.modules_mastered_count, 'module', 'modules')} (${formatIntWithCommas(r.metrics.questions_conquered)} mastery exam questions conquered`;
        if (r.metrics.average_exam_accuracy_pct > 0) {
          opener += `, ${r.metrics.average_exam_accuracy_pct.toFixed(1)}% avg accuracy`;
        }
        opener += ')';
        if (r.metrics.arcs_completed_count > 0) {
          opener += ` and finished ${r.metrics.arcs_completed_count} complete ${pluralizeWord(r.metrics.arcs_completed_count, 'quest arc', 'quest arcs')}`;
        }
        out.push(opener + '.\n');
      }
      if (r.groups.length > 0) {
        out.push('\nWhat I explored:\n');
        r.groups.forEach(g => {
          out.push(`\n▸ ${g.arc_title}\n`);
          g.modules.forEach(m => {
            out.push(`• ${m.title}\n`);
          });
        });
      }
      if (r.in_progress.length > 0) {
        out.push('\n📖 Currently in progress:\n');
        r.in_progress.slice(0, 4).forEach(ip => {
          out.push(`• ${ip.title} (${ip.progress_label})\n`);
        });
      }
      out.push('\nAlways happy to geek out on any of these topics — ask me anything!\n');
      return out.join('');
    }

    function formatLocalReportMessenger(r) {
      if (!r) return '';
      if (r.metrics.modules_mastered_count === 0 && r.metrics.in_progress_count === 0) {
        return `Quick learning update (${r.window_label}): no finished modules in this window yet — gearing up for the next one!`;
      }
      const out = [];
      if (r.metrics.modules_mastered_count > 0) {
        let head = `Quick study update (${r.window_label}): finished ${r.metrics.modules_mastered_count} ${pluralizeWord(r.metrics.modules_mastered_count, 'module', 'modules')} (${formatIntWithCommas(r.metrics.questions_conquered)} mastery questions)`;
        if (r.metrics.arcs_completed_count > 0) {
          head += `, wrapping up ${r.metrics.arcs_completed_count} full ${pluralizeWord(r.metrics.arcs_completed_count, 'arc', 'arcs')}`;
        }
        out.push(head + '!\n');
      } else {
        out.push(`Quick study update (${r.window_label}): currently working through ${r.metrics.in_progress_count} ${pluralizeWord(r.metrics.in_progress_count, 'module', 'modules')}!\n`);
      }
      if (r.groups.length > 0) {
        const maxGroups = Math.min(5, r.groups.length);
        r.groups.slice(0, maxGroups).forEach(g => {
          out.push(`\n▸ ${g.arc_title}\n`);
          g.modules.forEach(m => {
            out.push(`• ${m.title}\n`);
          });
        });
        if (r.groups.length > maxGroups) {
          const rem = r.groups.length - maxGroups;
          out.push(`\n...plus ${rem} more ${pluralizeWord(rem, 'topic', 'topics')}!\n`);
        }
      }
      if (r.in_progress.length > 0) {
        const ip = r.in_progress[0];
        out.push(`\nUp next: ${ip.title} (${ip.progress_label}).`);
      }
      return out.join('').trim() + '\n';
    }

    function formatLocalReportMarkdown(r) {
      if (!r) return '';
      const out = [];
      out.push(`# Knowledge Knights Progress Report — ${r.window_label}\n\n`);
      if (r.tag_filter) {
        out.push(`**Branch Filter:** \`${r.tag_filter}\`\n\n`);
      }
      out.push('## Summary Metrics\n\n| Metric | Value |\n| :--- | :--- |\n');
      out.push(`| Modules Mastered | ${r.metrics.modules_mastered_count} |\n`);
      out.push(`| Mastery Exam Questions Conquered | ${formatIntWithCommas(r.metrics.questions_conquered)} |\n`);
      if (r.metrics.average_exam_accuracy_pct > 0) {
        out.push(`| Average Final Exam Accuracy | ${r.metrics.average_exam_accuracy_pct.toFixed(1)}% |\n`);
      }
      out.push(`| Completed Quest Arcs | ${r.metrics.arcs_completed_count} |\n`);
      out.push(`| Total Merit Badges | ${r.metrics.total_badges_before} → ${r.metrics.total_badges_after} |\n`);
      if (r.metrics.in_progress_count > 0) {
        out.push(`| Active In-Progress Modules | ${r.metrics.in_progress_count} |\n`);
      }
      if (r.promotions.length > 0) {
        out.push('\n## Rank Promotions\n\n');
        r.promotions.forEach(p => {
          out.push(`* **${p.scope}:** Lv.${p.before_level} ${p.before_title} → **Lv.${p.after_level} ${p.after_title}** (${p.badges_after} badges)\n`);
        });
      }
      if (r.groups.length > 0) {
        out.push('\n## Completed Content\n');
        r.groups.forEach(g => {
          const heading = (g.curriculum_title && g.curriculum_title !== g.arc_title)
            ? `${g.curriculum_title}: ${g.arc_title}`
            : g.arc_title;
          let statusNote = '';
          if (g.arc_completed_now) {
            statusNote = ` *(Arc Complete: ${g.arc_mastered}/${g.arc_total})*`;
          } else if (g.arc_total > g.modules.length) {
            statusNote = ` *(${g.arc_mastered}/${g.arc_total} in arc)*`;
          }
          out.push(`\n### ${heading}${statusNote}\n\n`);
          g.modules.forEach(m => {
            const acc = m.accuracy_pct > 0 ? ` · ${m.accuracy_pct.toFixed(1)}% accuracy` : '';
            const ts = parseReportDateMs(m.awarded_at, false);
            const dateStr = ts !== null ? formatUtcShortDate(ts, true) : m.awarded_at;
            out.push(`* **${m.title}** (\`${dateStr}\`${acc})\n`);
            if (m.summary) out.push(`  ${m.summary}\n`);
            if (m.section_titles && m.section_titles.length > 0) {
              out.push(`  *Sections:* ${m.section_titles.join('; ')}\n`);
            }
            if (m.highlight_terms && m.highlight_terms.length > 0) {
              out.push(`  *Key terms:* ${m.highlight_terms.join(', ')}\n`);
            }
          });
        });
      }
      if (r.in_progress.length > 0) {
        out.push('\n## Currently In Progress\n\n');
        r.in_progress.forEach(ip => {
          out.push(`* **${ip.title}** — ${ip.progress_label} (${ip.progress_pct}%)\n`);
        });
      }
      return out.join('');
    }

    function formatLocalReportForForum(rep, forum) {
      if (forum === 'messenger') return formatLocalReportMessenger(rep);
      if (forum === 'markdown') return formatLocalReportMarkdown(rep);
      return formatLocalReportFacebook(rep);

      state.reportView.editedText = null;
      state.reportView.status = '';
      if (preset === 'custom') {
        const now = new Date();
        if (!state.reportView.customEnd) {
          state.reportView.customEnd = formatUtcDateInput(now);
        }
        if (!state.reportView.customStart) {
          state.reportView.customStart = formatUtcDateInput(new Date(now.getTime() - 14 * 24 * 60 * 60 * 1000));
        }
      }
      renderApp();
    }

    function selectMobileReportForum(forum) {
      state.reportView.forum = forum;
      state.reportView.editedText = null;
      state.reportView.status = '';
      renderApp();
    }

      Object.assign(state.reportView, patch || {});
      state.reportView.editedText = null;
      state.reportView.status = '';
      renderApp();

      }
