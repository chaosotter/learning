    async function copyMobileReportText() {
      const box = document.getElementById('mobileReportTextarea');
      if (!box || !box.value) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(box.value);
        } else {
          box.focus();
          box.select();
          document.execCommand('copy');
        }
        state.reportView.status = '✓ Report copied to clipboard!';
        state.reportView.statusKind = 'ok';
      } catch (_e) {
        box.focus();
        box.select();
        state.reportView.status = 'Selected report — use Copy on your device.';
        state.reportView.statusKind = 'info';
      }
      renderApp();
    }

    function buildReportBranchSelectOptions(selectedKey) {
      const { roots } = buildOntologyTree();
      const opts = ['<option value="">All Branches</option>'];
      const walk = (nodes, depth) => {
        (nodes || []).forEach(n => {
          const indent = depth > 0 ? '\u00A0\u00A0'.repeat(depth) + '↳ ' : '';
          const badges = n.level_info ? n.level_info.badges : 0;
          const label = `${indent}${n.name} (${badges} ${pluralizeWord(badges, 'badge', 'badges')})`;
          opts.push(`<option value="${escapeHtml(n.path_key)}" ${selectedKey === n.path_key ? 'selected' : ''}>${escapeHtml(label)}</option>`);
          if (n.children && n.children.length > 0) walk(n.children, depth + 1);
        });
      };
      walk(roots, 0);
      return opts.join('');
    }

    function renderReportTab(container) {
      const rv = state.reportView;
      const { error, report } = buildLocalProgressReport(new Date());
      const presets = [
        { id: 'last_7_days', label: 'Last 7d' },
        { id: 'last_30_days', label: 'Last 30d' },
        { id: 'this_month', label: 'This Month' },
        { id: 'this_quarter', label: 'Quarter' },
        { id: 'all_time', label: 'All Time' },
        { id: 'custom', label: 'Custom' },
      ];

      const presetButtonsHtml = presets.map(p => (
        `<button type="button" class="preset-chip ${rv.preset === p.id ? 'active' : ''}" onclick="selectMobileReportPreset('${p.id}')">${p.label}</button>`
      )).join('');

      const customDatesHtml = rv.preset === 'custom'
        ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
             <div class="field-group" style="margin-bottom:0">
               <label for="mobileReportStart">Start (UTC)</label>
               <input type="date" id="mobileReportStart" value="${escapeHtml(rv.customStart)}" onchange="updateMobileReportFilter({ customStart: this.value })">
             </div>
             <div class="field-group" style="margin-bottom:0">
               <label for="mobileReportEnd">End (UTC)</label>
               <input type="date" id="mobileReportEnd" value="${escapeHtml(rv.customEnd)}" onchange="updateMobileReportFilter({ customEnd: this.value })">
             </div>
           </div>`
        : '';

      const branchOptionsHtml = buildReportBranchSelectOptions(rv.tagPrefix);

      if (error || !report) {
        container.innerHTML = `
          <section class="panel-card">
            <div class="section-heading">
              <h2>📊 Progress Report</h2>
            </div>
            <div class="report-presets-grid">${presetButtonsHtml}</div>
            ${customDatesHtml}
            <div class="status-toast err">${escapeHtml(error || 'Unable to compute report.')}</div>
          </section>
        `;
        return;
      }

      const deterministicText = formatLocalReportForForum(report, rv.forum);
      const displayText = rv.editedText !== null ? rv.editedText : deterministicText;
      const isEdited = rv.editedText !== null && rv.editedText !== deterministicText;
      const m = report.metrics;
      const badgeDelta = Math.max(0, m.total_badges_after - m.total_badges_before);

      const promosHtml = report.promotions.length > 0
        ? `<div class="report-promo-list">
             ${report.promotions.map(p => (
               `<span class="report-promo-chip">🏆 ${escapeHtml(p.scope)}: Lv.${p.before_level} ${escapeHtml(p.before_title)} → Lv.${p.after_level} ${escapeHtml(p.after_title)}</span>`
             )).join('')}
           </div>`
        : '';

      const breakdownHtml = (() => {
        if (report.groups.length === 0 && report.in_progress.length === 0) {
          return `<p style="font-size:0.82rem;color:var(--text-muted);margin:10px 0 0">No completed or in-progress modules in this window.</p>`;
        }
        const blocks = report.groups.map(g => {
          const title = (g.curriculum_title && g.curriculum_title !== g.arc_title)
            ? `${g.curriculum_title} — ${g.arc_title}`
            : g.arc_title;
          const badge = g.arc_completed_now
            ? `<span class="cached-chip">✓ Arc Complete (${g.arc_mastered}/${g.arc_total})</span>`
            : `<span style="font-size:0.72rem;color:var(--text-muted)">${g.arc_mastered}/${g.arc_total} in arc</span>`;
          const rows = g.modules.map(mod => {
            const ts = parseReportDateMs(mod.awarded_at, false);
            const dateStr = ts !== null ? formatUtcShortDate(ts, true) : '';
            const acc = mod.accuracy_pct > 0 ? ` · ${mod.accuracy_pct.toFixed(1)}%` : '';
            return `<div style="padding:6px 0;border-top:1px solid rgba(255,255,255,0.06);font-size:0.82rem">
              <div style="font-weight:600;color:var(--text-main)">${escapeHtml(mod.title)}</div>
              <div style="font-size:0.73rem;color:var(--text-muted)">${escapeHtml(dateStr)}${escapeHtml(acc)}</div>
            </div>`;
          }).join('');
          return `<div style="margin-top:10px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:4px">
              <strong style="font-size:0.84rem;color:var(--gold-soft)">${escapeHtml(title)}</strong>
              ${badge}
            </div>
            ${rows}
          </div>`;
        });
        if (report.in_progress.length > 0) {
          const ipRows = report.in_progress.map(ip => (
            `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid rgba(255,255,255,0.06);font-size:0.8rem">
               <span>${escapeHtml(ip.title)}</span>
               <span style="color:var(--blue);white-space:nowrap">${escapeHtml(ip.progress_label)}</span>
             </div>`
          )).join('');
          blocks.push(`<div style="margin-top:10px">
            <strong style="font-size:0.83rem;color:var(--blue);display:block;margin-bottom:4px">Active In-Progress Quests</strong>
            ${ipRows}
          </div>`);
        }
        return blocks.join('');
      })();

      container.innerHTML = `
        <section class="panel-card">
          <div class="section-heading">
            <h2>📊 Progress Report</h2>
            <span>${escapeHtml(report.window_label)}</span>
          </div>

          <div class="report-presets-grid">${presetButtonsHtml}</div>
          ${customDatesHtml}

          <div class="field-group" style="margin-bottom:10px">
            <label for="mobileReportBranch">Ontology Branch</label>
            <select id="mobileReportBranch" onchange="updateMobileReportFilter({ tagPrefix: this.value })">
              ${branchOptionsHtml}
            </select>
          </div>

          <label class="toggle-label">
            <input type="checkbox" ${rv.includeInProgress ? 'checked' : ''}
              onchange="updateMobileReportFilter({ includeInProgress: this.checked })">
            <span>Include active in-progress quests</span>
          </label>
        </section>

        <section class="panel-card">
          <div class="report-stats-grid">
            <div class="report-stat-tile">
              <div class="report-stat-label">Mastered</div>
              <div class="report-stat-value">${m.modules_mastered_count}</div>
              <div class="report-stat-sub">${report.promotions.length > 0 ? `${report.promotions.length} rank-up${report.promotions.length === 1 ? '' : 's'}` : 'Modules in window'}</div>
            </div>
            <div class="report-stat-tile">
              <div class="report-stat-label">Questions</div>
              <div class="report-stat-value">${formatIntWithCommas(m.questions_conquered)}</div>
              <div class="report-stat-sub">${m.average_exam_accuracy_pct > 0 ? `${m.average_exam_accuracy_pct.toFixed(1)}% avg accuracy` : 'Exam mastery'}</div>
            </div>
            <div class="report-stat-tile">
              <div class="report-stat-label">Arcs Done</div>
              <div class="report-stat-value">${m.arcs_completed_count}</div>
              <div class="report-stat-sub">${m.in_progress_count > 0 ? `${m.in_progress_count} in progress` : 'Completed arcs'}</div>
            </div>
            <div class="report-stat-tile">
              <div class="report-stat-label">Total Badges</div>
              <div class="report-stat-value">${m.total_badges_after}</div>
              <div class="report-stat-sub">${badgeDelta > 0 ? `${m.total_badges_before} → ${m.total_badges_after} (+${badgeDelta})` : 'Cumulative'}</div>
            </div>
          </div>
          ${promosHtml}
        </section>

        <section class="panel-card">
          <div class="section-heading">
            <h2>✍️ Shareable Update</h2>
            <span id="mobileReportCharCount">${displayText.length.toLocaleString()} chars</span>
          </div>

          <div class="forum-seg-bar" role="tablist">
            <button type="button" class="forum-seg-btn ${rv.forum === 'facebook' ? 'active' : ''}" onclick="selectMobileReportForum('facebook')">Facebook</button>
            <button type="button" class="forum-seg-btn ${rv.forum === 'messenger' ? 'active' : ''}" onclick="selectMobileReportForum('messenger')">Messenger</button>
            <button type="button" class="forum-seg-btn ${rv.forum === 'markdown' ? 'active' : ''}" onclick="selectMobileReportForum('markdown')">Markdown</button>
          </div>

          <div class="field-group" style="margin-bottom:10px">
            <textarea id="mobileReportTextarea" class="report-text-box ${rv.forum === 'markdown' ? 'mono' : ''}" rows="11" oninput="onMobileReportTextInput(this)">${escapeHtml(displayText)}</textarea>
          </div>

          <div style="display:flex;gap:8px">
            <button type="button" class="btn-primary" style="flex:1" onclick="copyMobileReportText()">
              📋 Copy to Clipboard
            </button>
            <button type="button" id="mobileReportResetBtn" class="btn-sm" style="display:${isEdited ? 'inline-flex' : 'none'}" onclick="resetMobileReportDraft()">
              ↺ Reset
            </button>
          </div>

          ${rv.status ? `<div class="status-toast ${rv.statusKind}">${escapeHtml(rv.status)}</div>` : ''}

          <p style="margin:10px 0 0;font-size:0.75rem;color:var(--text-muted)">
            For AI narrative polishing via Jetski, sync your progress to the desktop server and open its <strong>Progress Report</strong> tab.
          </p>
        </section>

        <details class="syllabus-drawer">
          <summary>
            <span>📋 Included Modules &amp; Arcs (${m.modules_mastered_count} mastered · ${m.in_progress_count} active)</span>
            <span style="color:var(--text-muted);font-size:0.74rem">Tap to expand</span>
          </summary>
          <div class="syllabus-body">
            ${breakdownHtml}
          </div>
        </details>
      `;
    }

    // =========================================================================
    // 10. INITIALIZATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async () => {
      await loadLocalState();
      renderApp();
    });
  </script>
</body>
</html>
