    function parseGitHubRepoInput(rawOwnerRepo, rawPath, rawBranch) {
      let ownerRepo = String(rawOwnerRepo || '').trim();
      let path = String(rawPath || '').trim().replace(/^\/+|\/+$/g, '');
      let branch = String(rawBranch || '').trim() || 'main';

      // Support pasting full https://github.com/owner/repo/tree/branch/folder URLs
      const urlMatch = ownerRepo.match(/^https?:\/\/github\.com\/([^/]+\/[^/]+)(?:\/tree\/([^/]+)(?:\/(.*))?)?\/?$/i);
      if (urlMatch) {
        ownerRepo = urlMatch[1];
        if (urlMatch[2]) branch = urlMatch[2];
        if (urlMatch[3] && !path) path = urlMatch[3].replace(/^\/+|\/+$/g, '');
      }
      return { ownerRepo, path, branch };
    }

    async function browseGitHubRepo() {
      const ownerInput = document.getElementById('ghOwnerRepoInput');
      const pathInput = document.getElementById('ghPathInput');
      const branchInput = document.getElementById('ghBranchInput');

      const parsed = parseGitHubRepoInput(
        ownerInput ? ownerInput.value : state.repoConfig.ownerRepo,
        pathInput ? pathInput.value : state.repoConfig.path,
        branchInput ? branchInput.value : state.repoConfig.branch
      );

      if (!parsed.ownerRepo || !/^[^/\s]+\/[^/\s]+$/.test(parsed.ownerRepo)) {
        state.repoBrowser.error = 'Please enter a valid GitHub repository in "owner/repo" format (or paste a GitHub repository URL).';
        state.repoBrowser.status = '';
        renderApp();
        return;
      }

      state.repoConfig = parsed;
      saveRepoConfig();

      state.repoBrowser.loading = true;
      state.repoBrowser.error = '';
      state.repoBrowser.status = `Listing JSON modules in ${parsed.ownerRepo}...`;
      renderApp();

      try {
        const encodedPath = parsed.path
          ? '/' + parsed.path.split('/').map(encodeURIComponent).join('/')
          : '';
        let apiUrl = `https://api.github.com/repos/${parsed.ownerRepo}/contents${encodedPath}?ref=${encodeURIComponent(parsed.branch)}`;
        let resp = await fetch(apiUrl, { headers: { Accept: 'application/vnd.github.v3+json' } });

        // Automatic fallback to 'master' if 'main' 404s
        if (resp.status === 404 && parsed.branch === 'main') {
          const fallbackUrl = `https://api.github.com/repos/${parsed.ownerRepo}/contents${encodedPath}?ref=master`;
          const fallbackResp = await fetch(fallbackUrl, { headers: { Accept: 'application/vnd.github.v3+json' } });
          if (fallbackResp.ok) {
            resp = fallbackResp;
            state.repoConfig.branch = 'master';
            saveRepoConfig();
          }
        }

        if (!resp.ok) {
          throw new Error(`GitHub API returned HTTP ${resp.status}. Verify that the repository and folder path are public.`);
        }

        const data = await resp.json();
        const entries = Array.isArray(data) ? data : [data];
        const jsonFiles = entries
          .filter(item => item && item.type === 'file' && /\.json$/i.test(item.name) && item.download_url)
          .map(item => ({
            name: item.name,
            path: item.path,
            download_url: item.download_url,
            size: item.size || 0,
          }))
          .sort((a, b) => a.name.localeCompare(b.name));

        state.repoBrowser.files = jsonFiles;
        state.repoBrowser.loading = false;
        state.repoBrowser.status = jsonFiles.length > 0
          ? `Found ${jsonFiles.length} JSON file(s) in ${parsed.ownerRepo}.`
          : `No .json files found in "${parsed.path || '/'}" on branch "${state.repoConfig.branch}".`;
      } catch (err) {
        state.repoBrowser.loading = false;
        state.repoBrowser.error = err.message || String(err);
        state.repoBrowser.status = '';
      }
      renderApp();
    }

    async function fetchAndCacheModuleUrl(downloadUrl, label) {
      state.repoBrowser.loading = true;
      state.repoBrowser.error = '';
      state.repoBrowser.status = `Downloading ${label || downloadUrl}...`;
      renderApp();

      try {
        const resp = await fetch(downloadUrl);
        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status} while fetching ${label || downloadUrl}`);
        }
        const rawJson = await resp.json();
        const mod = validateAndNormalizeModule(rawJson);
        state.modulesById[mod.id] = mod;
        ensureSession(mod.id);
        if (!state.activeModuleId) state.activeModuleId = mod.id;
        saveModules();
        savePrefs();
        reconcileCompletedBadges();
        state.repoBrowser.loading = false;
        state.repoBrowser.status = `✓ Loaded "${mod.title}" (${mod.chunk_count} chunks, ${mod.question_count} questions).`;
      } catch (err) {
        state.repoBrowser.loading = false;
        state.repoBrowser.error = `Failed to load ${label || 'module'}: ${err.message || err}`;
        state.repoBrowser.status = '';
      }
      renderApp();
    }

    async function loadAllGitHubFiles() {
      const files = state.repoBrowser.files || [];
      if (files.length === 0) return;

      state.repoBrowser.loading = true;
      state.repoBrowser.error = '';
      let loadedCount = 0;
      const errors = [];

      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        state.repoBrowser.status = `Loading (${i + 1}/${files.length}): ${f.name}...`;
        renderApp();
        try {
          const resp = await fetch(f.download_url);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const rawJson = await resp.json();
          const mod = validateAndNormalizeModule(rawJson);
          state.modulesById[mod.id] = mod;
          ensureSession(mod.id);
          if (!state.activeModuleId) state.activeModuleId = mod.id;
          loadedCount++;
        } catch (err) {
          errors.push(`${f.name}: ${err.message || err}`);
        }
      }

      saveModules();
      savePrefs();
      reconcileCompletedBadges();
      state.repoBrowser.loading = false;
      state.repoBrowser.status = `✓ Loaded ${loadedCount} of ${files.length} module file(s).`;
      state.repoBrowser.error = errors.length > 0 ? `Skipped non-module/invalid files: ${errors.join('; ')}` : '';
      renderApp();
    }

    async function loadRawUrlInput() {
      const input = document.getElementById('rawModuleUrlInput');
      if (!input || !input.value.trim()) return;
      let url = input.value.trim();
      // Convert github.com/.../blob/... to raw.githubusercontent.com automatically
      const blobMatch = url.match(/^https?:\/\/github\.com\/([^/]+\/[^/]+)\/blob\/(.+)$/i);
      if (blobMatch) {
        url = `https://raw.githubusercontent.com/${blobMatch[1]}/${blobMatch[2]}`;
      }
      await fetchAndCacheModuleUrl(url, url.split('/').pop());
    }

    async function handleLocalFilesSelected(fileList) {
      if (!fileList || fileList.length === 0) return;
      let loaded = 0;
      const errors = [];
      for (let i = 0; i < fileList.length; i++) {
        const file = fileList[i];
        try {
          const text = await file.text();
          const raw = JSON.parse(text);
          const mod = validateAndNormalizeModule(raw);
          state.modulesById[mod.id] = mod;
          ensureSession(mod.id);
          if (!state.activeModuleId) state.activeModuleId = mod.id;
          loaded++;
        } catch (err) {
          errors.push(`${file.name}: ${err.message || err}`);
        }
      }
      saveModules();
      savePrefs();
      reconcileCompletedBadges();
      state.repoBrowser.status = loaded > 0 ? `✓ Imported ${loaded} local module file(s) into device cache.` : '';
      state.repoBrowser.error = errors.length > 0 ? errors.join(' | ') : '';
      renderApp();
    }

    function renderLibraryTab(container) {
      const rb = state.repoBrowser;
      const cachedMods = Object.values(state.modulesById);

      const filesHtml = (rb.files && rb.files.length > 0)
        ? `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
            <span style="font-size:0.8rem;color:var(--text-muted);font-weight:700">
              ${rb.files.length} JSON File(s) in Repository
            </span>
            <button type="button" class="btn-sm btn-primary" ${rb.loading ? 'disabled' : ''} onclick="loadAllGitHubFiles()">
              ⬇️ Load All (${rb.files.length})
            </button>
          </div>
          <div class="repo-file-list">
            ${rb.files.map(f => {
              const sizeKb = f.size ? `${Math.round(f.size / 1024)} KB` : 'JSON';
              const safeUrl = escapeHtml(f.download_url).replace(/'/g, "\\'");
              const safeName = escapeHtml(f.name).replace(/'/g, "\\'");
              return `
                <div class="repo-file-item">
                  <div class="repo-file-meta">
                    <div class="repo-file-name">${escapeHtml(f.name)}</div>
                    <div class="repo-file-sub">${escapeHtml(f.path)} · ${sizeKb}</div>
                  </div>
                  <button type="button" class="btn-sm btn-blue" ${rb.loading ? 'disabled' : ''} onclick="fetchAndCacheModuleUrl('${safeUrl}', '${safeName}')">
                    Load
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        `
        : '';

      container.innerHTML = `
        <section class="panel-card">
          <div class="section-heading">
            <h2>📦 Load from Public GitHub Repo</h2>
          </div>
          <p style="margin:0 0 12px;font-size:0.84rem;color:var(--text-muted)">
            Point to any public GitHub repository containing Knowledge Knights <code>.json</code> modules. Loaded modules are cached on your device for offline play.
          </p>

          <div class="field-group">
            <label for="ghOwnerRepoInput">GitHub Repository (owner/repo or URL)</label>
            <input type="text" id="ghOwnerRepoInput" placeholder="e.g. username/knowledge-knights-modules" value="${escapeHtml(state.repoConfig.ownerRepo)}">
          </div>

          <div style="display:grid;grid-template-columns:2fr 1fr;gap:10px">
            <div class="field-group">
              <label for="ghPathInput">Folder Path (optional)</label>
              <input type="text" id="ghPathInput" placeholder="e.g. modules" value="${escapeHtml(state.repoConfig.path)}">
            </div>
            <div class="field-group">
              <label for="ghBranchInput">Branch</label>
              <input type="text" id="ghBranchInput" placeholder="main" value="${escapeHtml(state.repoConfig.branch)}">
            </div>
          </div>

          <button type="button" class="btn-primary btn-block" ${rb.loading ? 'disabled' : ''} onclick="browseGitHubRepo()">
            ${rb.loading ? '⏳ Fetching...' : '🔍 Browse Repository Modules'}
          </button>

          ${rb.status ? `<div class="status-toast ok">${escapeHtml(rb.status)}</div>` : ''}
          ${rb.error ? `<div class="status-toast err">${escapeHtml(rb.error)}</div>` : ''}
          ${filesHtml}
        </section>

        <section class="panel-card">
          <div class="section-heading">
            <h2>📂 Load from Device File or Raw URL</h2>
          </div>
          <div class="field-group">
            <label>Select Local .json Module File(s)</label>
            <input type="file" accept=".json,application/json" multiple onchange="handleLocalFilesSelected(this.files)"
              style="padding:10px;background:var(--bg-panel);border:1px dashed var(--border);border-radius:9px;color:var(--text-muted)">
          </div>

          <div class="field-group" style="margin-top:12px;margin-bottom:8px">
            <label for="rawModuleUrlInput">Or Direct Module JSON URL</label>
            <div style="display:flex;gap:8px">
              <input type="url" id="rawModuleUrlInput" placeholder="https://raw.githubusercontent.com/.../module.json">
              <button type="button" class="btn-blue" onclick="loadRawUrlInput()">Fetch</button>
            </div>
          </div>
        </section>

        <section class="panel-card">
          <div class="section-heading">
            <h2>💾 Cached on This Device</h2>
            <span>${cachedMods.length} Module(s)</span>
          </div>
          ${cachedMods.length === 0
            ? `<p style="margin:0;font-size:0.84rem;color:var(--text-muted)">No modules cached yet.</p>`
            : `<div class="repo-file-list">
                 ${cachedMods.map(m => {
                   const safeId = escapeHtml(m.id).replace(/'/g, "\\'");
                   return `
                     <div class="repo-file-item">
                       <div class="repo-file-meta">
                         <div class="repo-file-name">${escapeHtml(m.title)}</div>
                         <div class="repo-file-sub">${escapeHtml(m.tag_path_key)} · ${m.chunk_count} chunks</div>
                       </div>
                       <div style="display:flex;gap:6px">
                         <button type="button" class="btn-sm btn-primary" onclick="openModuleQuest('${safeId}')">Play</button>
                         <button type="button" class="btn-sm" onclick="removeCachedModule('${safeId}')">🗑️</button>
                       </div>
                     </div>
                   `;
                 }).join('')}
               </div>`
          }
        </section>
      `;
    }

    // =========================================================================
    // 9. TAB 4: SYNC / CUT-AND-PASTE CROSS-DEVICE STATE TRANSFER
    // =========================================================================
    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) {
        bin += String.fromCharCode(bytes[i]);
      }
      return btoa(bin);
    }

    function base64ToUtf8(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function buildExportPayloadObject() {
      return {
        version: 1,
        exported_at: new Date().toISOString(),
        repo_config: state.repoConfig,
        hide_mastered: state.hideMastered,
        profile: state.profile,
        sessions: state.sessions,
      };
    }

    function generateTransferString(asRawJson) {
      const payload = buildExportPayloadObject();
      if (asRawJson) {
        return JSON.stringify(payload, null, 2);
      }
      return 'KK1:' + utf8ToBase64(JSON.stringify(payload));
    }

    function parseTransferString(rawInput) {
      const trimmed = String(rawInput || '').trim();
      if (!trimmed) {
        throw new Error('Please paste a transfer code or JSON snapshot first.');
      }
      let jsonStr = trimmed;
      if (trimmed.startsWith('KK1:')) {
        const b64Part = trimmed.slice(4).replace(/\s+/g, '');
        try {
          jsonStr = base64ToUtf8(b64Part);
        } catch (_e) {
          throw new Error('Invalid KK1 Base64 transfer code. Ensure the entire code was copied.');
        }
      } else if (!trimmed.startsWith('{')) {
        try {
          jsonStr = base64ToUtf8(trimmed.replace(/\s+/g, ''));
        } catch (_e) {
          throw new Error('Unrecognized transfer format. Paste a KK1:... code or JSON object.');
        }
      }

      let data;
      try {
        data = JSON.parse(jsonStr);
      } catch (_e) {
        throw new Error('Transfer payload is not valid JSON.');
      }
      if (!data || typeof data !== 'object') {
        throw new Error('Transfer payload must be an object.');
      }
      return data;
    }

    // Progress rank comparison for Smart Merge
    function sessionProgressScore(s) {
      if (!s || typeof s !== 'object') return [0, 0, 0];
      if (s.phase === PHASE_COMPLETED) {
        return [3, s.exam_mastered_count || 100, s.exam_total_attempts || 0];
      }
      if (s.phase === PHASE_FINAL_EXAM) {
        return [2, s.exam_mastered_count || 0, s.exam_total_attempts || 0];
      }
      const answeredLen = Array.isArray(s.answered_in_chunk) ? s.answered_in_chunk.length : 0;
      return [1, s.current_chunk_index || 0, answeredLen];
    }

    function isSessionFurtherAhead(candidate, current) {
      if (!current) return true;
      if (!candidate) return false;
      const a = sessionProgressScore(candidate);
      const b = sessionProgressScore(current);
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return a[i] > b[i];
      }
      return false;
    }

    function applyImportedPayload(data, mode) {
      const incomingBadges = (data.profile && Array.isArray(data.profile.badges))
        ? data.profile.badges
        : [];
      const incomingSessions = (data.sessions && typeof data.sessions === 'object')
        ? data.sessions
        : {};

      if (mode === 'replace') {
        state.profile = { badges: incomingBadges };
        state.sessions = incomingSessions;
        if (data.repo_config && typeof data.repo_config === 'object') {
          state.repoConfig = {
            ownerRepo: String(data.repo_config.ownerRepo || ''),
            path: String(data.repo_config.path || ''),
            branch: String(data.repo_config.branch || 'main'),
          };
        }
        if (typeof data.hide_mastered === 'boolean') {
          state.hideMastered = data.hide_mastered;
        }
      } else {
        // Smart Merge: union badges by module_id (keeping earliest awarded_at)
        const mergedBadgesById = {};
        (state.profile.badges || []).forEach(b => {
          if (b && b.module_id) mergedBadgesById[b.module_id] = { ...b };
        });
        incomingBadges.forEach(b => {
          if (!b || !b.module_id) return;
          const existing = mergedBadgesById[b.module_id];
          if (!existing) {
            mergedBadgesById[b.module_id] = {
              module_id: String(b.module_id),
              module_title: String(b.module_title || b.module_id),
              tag_path: normalizeTagPath(b.tag_path),
              awarded_at: String(b.awarded_at || new Date().toISOString()),
            };
          } else if (b.awarded_at && (!existing.awarded_at || b.awarded_at < existing.awarded_at)) {
            existing.awarded_at = b.awarded_at;
          }
        });
        state.profile.badges = Object.values(mergedBadgesById);

        // Smart Merge sessions: keep whichever session per module has progressed further
        Object.entries(incomingSessions).forEach(([modId, incSess]) => {
          if (!incSess || typeof incSess !== 'object') return;
          const localSess = state.sessions[modId];
          if (isSessionFurtherAhead(incSess, localSess)) {
            state.sessions[modId] = incSess;
          }
        });

        if (!state.repoConfig.ownerRepo && data.repo_config && data.repo_config.ownerRepo) {
          state.repoConfig = {
            ownerRepo: String(data.repo_config.ownerRepo || ''),
            path: String(data.repo_config.path || ''),
            branch: String(data.repo_config.branch || 'main'),
          };
        }
      }

      reconcileCompletedBadges();
      saveProfile();
      saveSessions();
      saveRepoConfig();
      savePrefs();
    }

    async function copyExportTransferCode() {
      const box = document.getElementById('exportCodeBox');
      if (!box) return;
      const text = box.value;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          box.focus();
          box.select();
          document.execCommand('copy');
        }
        state.syncView.status = '✓ Transfer code copied to clipboard!';
        state.syncView.statusKind = 'ok';
      } catch (_e) {
        box.focus();
        box.select();
        state.syncView.status = 'Selected transfer code — use Copy on your device.';
        state.syncView.statusKind = 'info';
      }
      renderApp();
    }

    function handleImportTransferCode() {
      const box = document.getElementById('importCodeBox');
      const raw = box ? box.value : '';
      try {
        const data = parseTransferString(raw);
        applyImportedPayload(data, state.syncView.importMode);
        const badgeCount = (state.profile.badges || []).length;
        const sessCount = Object.keys(state.sessions || {}).length;
        state.syncView.status = `✓ Imported successfully (${state.syncView.importMode === 'merge' ? 'Smart Merge' : 'Replace All'}): ${badgeCount} Badge(s), ${sessCount} Module Session(s).`;
        state.syncView.statusKind = 'ok';
      } catch (err) {
        state.syncView.status = `✗ Import failed: ${err.message || err}`;
        state.syncView.statusKind = 'err';
      }
      renderApp();
    }

    function renderSyncTab(container) {
      const exportStr = generateTransferString(state.syncView.showRawJson);
      const badgeCount = (state.profile.badges || []).length;
      const sessCount = Object.keys(state.sessions || {}).length;

      container.innerHTML = `
        <section class="panel-card">
          <div class="section-heading">
            <h2>📤 Export Progress from This Device</h2>
            <span>${badgeCount} Badge(s) · ${sessCount} Session(s)</span>
          </div>
          <p style="margin:0 0 10px;font-size:0.84rem;color:var(--text-muted)">
            Copy this single-line transfer code to migrate your earned Merit Badges, in-progress quests, and repository settings to another phone, tablet, or browser.
          </p>

          <div class="field-group">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <label for="exportCodeBox">Transfer Payload (${state.syncView.showRawJson ? 'Formatted JSON' : 'Compact Base64'})</label>
              <label class="toggle-label" style="font-size:0.75rem">
                <input type="checkbox" ${state.syncView.showRawJson ? 'checked' : ''}
                  onchange="state.syncView.showRawJson = this.checked; renderApp();">
                <span>Show Raw JSON</span>
              </label>
            </div>
            <textarea id="exportCodeBox" rows="${state.syncView.showRawJson ? 7 : 3}" readonly onclick="this.select()">${escapeHtml(exportStr)}</textarea>
          </div>

          <button type="button" class="btn-primary btn-block" onclick="copyExportTransferCode()">
            📋 Copy Transfer Code
          </button>
        </section>

        <section class="panel-card">
          <div class="section-heading">
            <h2>📥 Import Progress onto This Device</h2>
          </div>
          <p style="margin:0 0 10px;font-size:0.84rem;color:var(--text-muted)">
            Paste a <code>KK1:...</code> transfer code (or raw JSON snapshot) from another device below.
          </p>

          <div class="radio-cards">
            <div class="radio-card ${state.syncView.importMode === 'merge' ? 'active' : ''}"
                 onclick="state.syncView.importMode = 'merge'; renderApp();">
              <div class="radio-card-title">✓ Smart Merge</div>
              <div class="radio-card-desc">Union of earned badges + keeps furthest progress per module.</div>
            </div>
            <div class="radio-card ${state.syncView.importMode === 'replace' ? 'active' : ''}"
                 onclick="state.syncView.importMode = 'replace'; renderApp();">
              <div class="radio-card-title">⇄ Replace All</div>
              <div class="radio-card-desc">Overwrite local badges and sessions with pasted snapshot.</div>
            </div>
          </div>

          <div class="field-group">
            <label for="importCodeBox">Paste Transfer Code or JSON</label>
            <textarea id="importCodeBox" rows="4" placeholder="Paste KK1:... transfer code here"></textarea>
          </div>

          <button type="button" class="btn-blue btn-block" onclick="handleImportTransferCode()">
            📥 Apply Imported State (${state.syncView.importMode === 'merge' ? 'Smart Merge' : 'Replace All'})
          </button>

          ${state.syncView.status
            ? `<div class="status-toast ${state.syncView.statusKind}">${escapeHtml(state.syncView.status)}</div>`
            : ''}
        </section>
      `;
    }

    // =========================================================================
    // 10. INITIALIZATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalState();
      renderApp();
    });
  </script>
</body>
